<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>DocMind — Ask your PDFs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root {
    color-scheme: light dark;
    --ink: #1b1d22;
    --paper: #f6f4ef;
    --panel: #ffffff;
    --line: #e4e0d6;
    --accent: #3d5a80;
    --accent-soft: #e8edf3;
    --accent-hover: #2f4763;
    --on-accent: #ffffff;
    --muted: #6b6f76;
    --good: #2e7d55;
    --bad: #b3402f;
    --bad-soft: #f8e9e6;
    --disabled: #cfcbc0;
    --user-bg: #1b1d22;
    --user-fg: #f6f4ef;
    --btn-bg: #1b1d22;
    --btn-fg: #f6f4ef;
    --btn-hover: #3d5a80;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ece9e2;
      --paper: #14161a;
      --panel: #1c1f24;
      --line: #2e3238;
      --accent: #7ea2d4;
      --accent-soft: #232c3a;
      --accent-hover: #9bb9e0;
      --on-accent: #10151c;
      --muted: #9aa0a8;
      --good: #5bbf8a;
      --bad: #e08a7a;
      --bad-soft: #3a2522;
      --disabled: #3a3e45;
      --user-bg: #2d4a73;
      --user-fg: #f2f5fa;
      --btn-bg: #7ea2d4;
      --btn-fg: #10151c;
      --btn-hover: #9bb9e0;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    height: 100vh;
    display: flex;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 320px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-height: 0;
  }

  .brand {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .brand span { color: var(--accent); }

  .tagline {
    font-size: 13px;
    color: var(--muted);
    margin: 6px 0 0;
    line-height: 1.5;
  }

  .upload-box {
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    padding: 20px 16px;
    text-align: center;
    transition: border-color 0.15s ease;
  }

  .upload-box.drag { border-color: var(--accent); background: var(--accent-soft); }
  .upload-box input[type="file"] { display: none; }

  .upload-label {
    display: block;
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
  }

  .upload-label strong {
    color: var(--ink);
    display: block;
    margin-bottom: 4px;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  button.primary {
    background: var(--btn-bg);
    color: var(--btn-fg);
    border: none;
    padding: 11px 16px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s ease;
  }

  button.primary:hover { background: var(--btn-hover); }
  button.primary:disabled { background: var(--disabled); cursor: not-allowed; }

  .status-line { font-size: 12.5px; color: var(--muted); min-height: 18px; line-height: 1.5; }
  .status-line.ok { color: var(--good); }
  .status-line.err { color: var(--bad); }

  .doc-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    min-height: 0;
  }

  .doc-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 2px 0 4px;
  }

  .doc-item {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
    text-align: left;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink);
    padding: 10px 12px;
    background: var(--paper);
    border-radius: 8px;
    border: 1px solid var(--line);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .doc-item:hover { border-color: var(--accent); }
  .doc-item.active { background: var(--accent-soft); border-color: var(--accent); font-weight: 500; }

  .doc-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); flex-shrink: 0; }
  .doc-item.active .doc-dot { background: var(--accent); }

  .doc-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .doc-row { display: flex; align-items: center; gap: 6px; }

  .doc-del {
    flex-shrink: 0;
    width: 34px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease;
  }

  .doc-del:hover { color: var(--bad); background: var(--bad-soft); }

  .sidebar-foot {
    margin-top: 0;
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.6;
  }

  .account {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .account-email {
    font-size: 12.5px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .link-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    padding: 0;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--accent);
    cursor: pointer;
  }

  .link-btn:hover { text-decoration: underline; }

  /* ---------- Chat area ---------- */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    min-width: 0;
  }

  .chat-header {
    padding: 22px 40px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .chat-header > div:first-child { min-width: 0; }

  .chat-header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 20px;
    margin: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .chat-header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

  .lang-switch {
    display: flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 3px;
    gap: 2px;
    flex-shrink: 0;
  }

  .lang-btn {
    border: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .lang-btn:hover { color: var(--ink); }
  .lang-btn.active { background: var(--ink); color: var(--paper); }

  .header-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

  .ghost-btn {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 14px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .ghost-btn:hover:not(:disabled) { color: var(--bad); border-color: var(--bad); }
  .ghost-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 32px 40px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    max-width: 380px;
    color: var(--muted);
  }

  .empty-state .glyph {
    font-family: 'Fraunces', serif;
    font-size: 40px;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .empty-state h2 {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: var(--ink);
    margin: 0 0 6px;
    font-weight: 600;
  }

  .empty-state p { font-size: 13px; line-height: 1.6; margin: 0; word-break: break-word; }

  .msg { display: flex; flex-direction: column; max-width: 70%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 13px 16px;
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .bubble { background: var(--user-bg); color: var(--user-fg); border-bottom-right-radius: 3px; }
  .msg.bot .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 3px; }

  .sources { margin-top: 7px; display: flex; gap: 6px; flex-wrap: wrap; }

  .source-chip {
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 9px;
    border-radius: 100px;
  }

  .chips { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }

  .chip {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--accent);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 8px 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .chip:hover { border-color: var(--accent); background: var(--accent-soft); }

  .typing { display: flex; gap: 4px; padding: 4px 2px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .composer { padding: 20px 40px 26px; border-top: 1px solid var(--line); }

  .composer-inner {
    display: flex;
    gap: 10px;
    background: var(--panel);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 6px 6px 6px 16px;
    align-items: center;
  }

  .composer-inner:focus-within { border-color: var(--accent); }

  .composer input {
    border: none;
    outline: none;
    flex: 1;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    padding: 10px 0;
    background: transparent;
  }

  .send-btn {
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s ease;
  }

  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:disabled { background: var(--disabled); cursor: not-allowed; }

  .composer-hint { font-size: 11.5px; color: var(--muted); margin-top: 8px; text-align: center; }
</style>
</head>
<body>

  <aside class="sidebar">
    <div>
      <div class="brand">Doc<span>Mind</span></div>
      <p class="tagline">Upload a PDF, then ask it anything.</p>
    </div>

    <div class="upload-box" id="dropZone">
      <label class="upload-label" for="pdfFile">
        <strong id="dropTitle">Drop a PDF here</strong>
        or click to browse
      </label>
      <input type="file" id="pdfFile" accept=".pdf" />
    </div>

    <button class="primary" id="uploadBtn">Upload &amp; index</button>
    <div class="status-line" id="uploadStatus"></div>

    <div class="doc-list" id="docList"></div>

    <div class="account">
      <div class="account-email" id="accountEmail"></div>
      <button type="button" class="link-btn" id="logoutBtn">Sign out</button>
    </div>

    <div class="sidebar-foot">
      Built with Node.js, Voyage embeddings &amp; retrieval-augmented generation.
    </div>
  </aside>

  <main class="chat-area">
    <div class="chat-header">
      <div>
        <h1 id="chatTitle">Ask your documents</h1>
        <p id="chatSub">Upload a PDF to get started.</p>
      </div>
      <div class="header-actions">
        <button class="ghost-btn" id="clearBtn" type="button">Clear chat</button>
        <div class="lang-switch" id="langSwitch" role="group" aria-label="Answer language">
          <button class="lang-btn" data-lang="english">English</button>
          <button class="lang-btn" data-lang="hindi">हिन्दी</button>
          <button class="lang-btn active" data-lang="hinglish">Hinglish</button>
        </div>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="composer">
      <div class="composer-inner">
        <input type="text" id="chatInput" placeholder="Ask something about your document…" />
        <button class="send-btn" id="sendBtn" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="composer-hint">Press Enter to send</div>
    </div>
  </main>

<script>
  const pdfFile = document.getElementById('pdfFile');
  const dropZone = document.getElementById('dropZone');
  const dropTitle = document.getElementById('dropTitle');
  const uploadBtn = document.getElementById('uploadBtn');
  const uploadStatus = document.getElementById('uploadStatus');
  const docList = document.getElementById('docList');
  const messagesEl = document.getElementById('messages');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const chatTitle = document.getElementById('chatTitle');
  const chatSub = document.getElementById('chatSub');
  const clearBtn = document.getElementById('clearBtn');
  const accountEmail = document.getElementById('accountEmail');
  const logoutBtn = document.getElementById('logoutBtn');

  let documents = [];          // names of PDFs stored on the server
  let selected = null;         // the PDF we are chatting with
  let language = 'hinglish';
  let selectedFile = null;     // file picked for upload
  const histories = {};        // filename -> list of messages
  const pending = new Set();   // filenames waiting for an answer

  const WELCOME = {
    english: {
      hello: name => "Hi! I'm DocMind. I have " + name + " open. Ask me anything about it, or try one of these:",
      chips: ['Summarize this PDF', 'What is the title of this PDF?', 'What is this PDF about?']
    },
    hindi: {
      hello: name => 'नमस्ते! मैं DocMind हूँ। मेरे पास ' + name + ' खुली है। इसके बारे में कुछ भी पूछिए, या इनमें से कोई आज़माइए:',
      chips: ['इस PDF का सारांश बताइए', 'इस PDF का शीर्षक क्या है?', 'इस PDF में क्या है?']
    },
    hinglish: {
      hello: name => 'Hi! Main DocMind hoon. Mere paas ' + name + ' khuli hai. Isme se kuch bhi poochho, ya inme se koi try karo:',
      chips: ['Is PDF ka summary batao', 'Is PDF ka title kya hai?', 'Is PDF mein kya hai?']
    }
  };

  /* ---------- Saved chats (stays in this browser, survives refresh) ---------- */
  let STORAGE_KEY = 'docmind:v1';   // sign in ke baad ban jata hai: docmind:v1:<user id>

  function loadSaved() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const data = raw ? JSON.parse(raw) : {};
      return data && typeof data === 'object' ? data : {};
    } catch (err) {
      return {};
    }
  }

  // Failed answers aur bina jawab wale sawaal save nahi karte
  function savableMessages(list) {
    return list.filter((m, i) => {
      if (m.error) return false;
      if (m.role === 'user') {
        const next = list[i + 1];
        return !!next && !next.error;
      }
      return true;
    });
  }

  function saveState() {
    try {
      const clean = {};
      Object.keys(histories).forEach(name => {
        const msgs = savableMessages(histories[name]);
        if (msgs.length) clean[name] = msgs;
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ histories: clean, selected, language }));
    } catch (err) {
      // storage full ya blocked: chat chalti rahegi, bas save nahi hogi
    }
  }

  function setLanguage(lang) {
    language = lang;
    document.querySelectorAll('.lang-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
  }

  // Document list aane ke baad hi tay hoga ki kaunsa document khulega
  let preferredDocument = null;

  // Is user ki saved chat wapas lao (user pehchan hone ke baad hi chalta hai)
  function restoreSaved() {
    const saved = loadSaved();
    if (saved.histories && typeof saved.histories === 'object') {
      Object.keys(saved.histories).forEach(name => {
        if (Array.isArray(saved.histories[name])) histories[name] = saved.histories[name];
      });
    }
    if (saved.language && WELCOME[saved.language]) setLanguage(saved.language);
    if (typeof saved.selected === 'string') preferredDocument = saved.selected;
  }

  // Server pe jo documents nahi bache, unki chat bhi hata do
  function pruneHistories() {
    Object.keys(histories).forEach(name => {
      if (!documents.includes(name)) delete histories[name];
    });
  }

  /* ---------- Language switch ---------- */
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setLanguage(btn.dataset.lang);
      saveState();
      renderMessages();   // welcome message ki language bhi badal jaye
    });
  });

  /* ---------- Rendering ---------- */
  function renderDocList() {
    docList.innerHTML = '';
    if (!documents.length) return;

    const label = document.createElement('div');
    label.className = 'doc-label';
    label.textContent = 'Your documents';
    docList.appendChild(label);

    [...documents].reverse().forEach(name => {
      const row = document.createElement('div');
      row.className = 'doc-row';

      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'doc-item' + (name === selected ? ' active' : '');
      item.title = name;

      const dot = document.createElement('div');
      dot.className = 'doc-dot';
      const text = document.createElement('span');
      text.textContent = name;

      item.appendChild(dot);
      item.appendChild(text);
      item.addEventListener('click', () => selectDocument(name));

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'doc-del';
      del.title = 'Delete this document';
      del.setAttribute('aria-label', 'Delete ' + name);
      del.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>';
      del.addEventListener('click', () => deleteDocument(name));

      row.appendChild(item);
      row.appendChild(del);
      docList.appendChild(row);
    });
  }

  function renderHeader() {
    if (selected) {
      chatTitle.textContent = selected;
      chatSub.textContent = 'Answers come only from this PDF.';
    } else if (documents.length) {
      chatTitle.textContent = 'Select a document';
      chatSub.textContent = 'Pick a PDF from the left to start chatting.';
    } else {
      chatTitle.textContent = 'Ask your documents';
      chatSub.textContent = 'Upload a PDF to get started.';
    }
  }

  function renderComposer() {
    const busy = selected && pending.has(selected);
    chatInput.disabled = !selected;
    sendBtn.disabled = !selected || busy;
    chatInput.placeholder = selected
      ? 'Ask something about this document…'
      : 'Select a document first…';
    clearBtn.disabled = !selected || busy || !(histories[selected] || []).length;
  }

  function showEmpty(title, text) {
    const box = document.createElement('div');
    box.className = 'empty-state';

    const glyph = document.createElement('div');
    glyph.className = 'glyph';
    glyph.textContent = '“ ”';
    const h2 = document.createElement('h2');
    h2.textContent = title;
    const p = document.createElement('p');
    p.textContent = text;

    box.appendChild(glyph);
    box.appendChild(h2);
    box.appendChild(p);
    messagesEl.appendChild(box);
  }

  function buildMessage(m) {
    const msg = document.createElement('div');
    msg.className = 'msg ' + m.role;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = m.text;
    msg.appendChild(bubble);

    if (m.sources && m.sources.length) {
      const src = document.createElement('div');
      src.className = 'sources';
      m.sources.forEach((s, i) => {
        const chip = document.createElement('div');
        chip.className = 'source-chip';
        chip.textContent = 'Passage ' + (i + 1) + ' · ' + Math.round(s.score * 100) + '% match';
        src.appendChild(chip);
      });
      msg.appendChild(src);
    }
    return msg;
  }

  function buildWelcome() {
    const text = WELCOME[language];

    const msg = document.createElement('div');
    msg.className = 'msg bot';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text.hello(selected);
    msg.appendChild(bubble);

    const chips = document.createElement('div');
    chips.className = 'chips';
    text.chips.forEach(label => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.textContent = label;
      chip.addEventListener('click', () => askQuestion(label));
      chips.appendChild(chip);
    });
    msg.appendChild(chips);

    return msg;
  }

  function buildTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg bot';
    msg.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    return msg;
  }

  function renderMessages() {
    messagesEl.innerHTML = '';

    if (!documents.length) {
      showEmpty('Nothing uploaded yet', 'Add a PDF on the left, then ask a question about it here.');
      return;
    }
    if (!selected) {
      showEmpty('No document selected', 'Click a document on the left to chat with it.');
      return;
    }

    const history = histories[selected] || [];
    if (!history.length && !pending.has(selected)) {
      messagesEl.appendChild(buildWelcome());
      return;
    }

    history.forEach(m => messagesEl.appendChild(buildMessage(m)));
    if (pending.has(selected)) messagesEl.appendChild(buildTyping());
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderAll() {
    renderDocList();
    renderHeader();
    renderComposer();
    renderMessages();
  }

  function selectDocument(name) {
    selected = name;
    saveState();
    renderAll();
    chatInput.focus();
  }

  /* ---------- Server calls ---------- */
  // Agar login khatam ho gaya (401), toh seedha login page pe bhejo
  async function api(url, options) {
    const res = await fetch(url, options);
    if (res.status === 401) {
      window.location.href = '/login.html';
      throw new Error('Please sign in.');
    }
    return res;
  }

  /* ---------- Load documents from server ---------- */
  async function loadDocuments(selectName) {
    let loaded = false;
    try {
      const res = await api('/documents');
      const data = await res.json();
      documents = data.documents || [];
      loaded = true;
    } catch (err) {
      documents = [];
    }

    if (selectName && documents.includes(selectName)) {
      selected = selectName;
    } else if (!selected || !documents.includes(selected)) {
      selected = documents.includes(preferredDocument)
        ? preferredDocument
        : (documents.length ? documents[documents.length - 1] : null);
    }
    preferredDocument = null;

    // Server na mile toh kuch bhi mitana nahi, warna saari saved chat ud jayegi
    if (loaded) {
      pruneHistories();
      saveState();
    }
    renderAll();
  }

  /* ---------- Delete ---------- */
  async function deleteDocument(name) {
    if (!confirm('Delete "' + name + '" and its chat? This cannot be undone.')) return;

    try {
      const res = await api('/documents/' + encodeURIComponent(name), { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Delete failed');

      delete histories[name];
      saveState();
      uploadStatus.textContent = 'Deleted ' + name + '.';
      uploadStatus.className = 'status-line ok';
      await loadDocuments();
    } catch (err) {
      uploadStatus.textContent = err.message;
      uploadStatus.className = 'status-line err';
    }
  }

  /* ---------- Upload ---------- */
  function setPickedFile(file) {
    selectedFile = file || null;
    dropTitle.textContent = file ? file.name : 'Drop a PDF here';
  }

  pdfFile.addEventListener('change', () => setPickedFile(pdfFile.files[0]));

  ['dragover', 'dragleave', 'drop'].forEach(evt => {
    dropZone.addEventListener(evt, e => e.preventDefault());
  });
  dropZone.addEventListener('dragover', () => dropZone.classList.add('drag'));
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', e => {
    dropZone.classList.remove('drag');
    if (e.dataTransfer.files[0]) {
      pdfFile.files = e.dataTransfer.files;
      setPickedFile(e.dataTransfer.files[0]);
    }
  });

  uploadBtn.addEventListener('click', async () => {
    if (!selectedFile) {
      uploadStatus.textContent = 'Choose a PDF first.';
      uploadStatus.className = 'status-line';
      return;
    }

    uploadBtn.disabled = true;
    uploadStatus.textContent = 'Reading, chunking & embedding…';
    uploadStatus.className = 'status-line';

    const formData = new FormData();
    formData.append('pdf', selectedFile);

    try {
      const res = await api('/upload', { method: 'POST', body: formData });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Upload failed');

      uploadStatus.textContent = 'Indexed ' + data.totalChunks + ' chunk' + (data.totalChunks === 1 ? '' : 's') + '.';
      uploadStatus.className = 'status-line ok';

      delete histories[data.filename];   // fresh chat for a re-uploaded file
      setPickedFile(null);
      pdfFile.value = '';
      await loadDocuments(data.filename);
    } catch (err) {
      uploadStatus.textContent = err.message;
      uploadStatus.className = 'status-line err';
    } finally {
      uploadBtn.disabled = false;
    }
  });

  /* ---------- Chat ---------- */
  function addToHistory(name, message) {
    if (!documents.includes(name)) return;   // document was deleted meanwhile
    if (!histories[name]) histories[name] = [];
    histories[name].push(message);
    saveState();
  }

  async function sendMessage() {
    const query = chatInput.value.trim();
    const target = selected;
    if (!query || !target || pending.has(target)) return;

    addToHistory(target, { role: 'user', text: query });
    chatInput.value = '';
    pending.add(target);
    renderMessages();
    renderComposer();

    try {
      const res = await api('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, language, filename: target })
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Something went wrong');

      addToHistory(target, { role: 'bot', text: data.answer, sources: data.sources });
    } catch (err) {
      addToHistory(target, { role: 'bot', text: 'Error: ' + err.message, error: true });
    } finally {
      pending.delete(target);
      if (selected === target) renderMessages();
      renderComposer();
      if (selected === target) chatInput.focus();
    }
  }

  function askQuestion(text) {
    chatInput.value = text;
    sendMessage();
  }

  function clearChat() {
    if (!selected || !(histories[selected] || []).length) return;
    if (!confirm('Clear this chat? The document stays.')) return;

    delete histories[selected];
    saveState();
    renderAll();
  }

  clearBtn.addEventListener('click', clearChat);
  sendBtn.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });

  /* ---------- Sign out ---------- */
  logoutBtn.addEventListener('click', async () => {
    try {
      await fetch('/auth/logout', { method: 'POST' });
    } catch (err) {
      // server na mile tab bhi login page pe chalte hain
    }
    window.location.href = '/login.html';
  });

  /* ---------- Start ---------- */
  async function init() {
    let user = null;

    try {
      const res = await fetch('/auth/me');
      const data = await res.json();
      user = data.user;
    } catch (err) {
      messagesEl.innerHTML = '';
      showEmpty('Server not reachable', 'Could not connect to the server. Please check that it is running, then refresh the page.');
      return;
    }

    if (!user) {
      window.location.href = '/login.html';
      return;
    }

    accountEmail.textContent = user.email;
    accountEmail.title = user.email;
    STORAGE_KEY = 'docmind:v1:' + user.id;   // har user ki chat alag
    restoreSaved();

    renderAll();
    loadDocuments();
  }

  init();
</script>
</body>
</html>
